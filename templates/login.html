<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#FBFAF7;color:#1C1B19;
  font:16px/1.5 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.box{width:320px;padding:0 20px}
h1{font-size:22px;font-weight:600;margin:0 0 6px}
p{color:#6E6A63;font-size:15px;margin:0 0 20px}
input{font:inherit;font-size:15px;width:100%;padding:9px 11px;border:1px solid #DFDBD2;
  background:#fff;border-radius:2px;margin-bottom:11px}
button{font:inherit;font-size:15px;width:100%;padding:9px;border:1px solid #1C1B19;
  background:#1C1B19;color:#FBFAF7;border-radius:2px;cursor:pointer}
.fehler{background:#F6E8E5;color:#9A3324;padding:9px 12px;font-size:14px;
  margin-bottom:14px;border-left:3px solid #9A3324}
:focus-visible{outline:2px solid #1F6F4A;outline-offset:1px}
</style>
</head>
<body>
<div class="box">
  <h1>TheraTalent Reaktivierung</h1>
  <p>Passwort eingeben, um fortzufahren.</p>
  {% if fehler %}<div class="fehler">Passwort stimmt nicht.</div>{% endif %}
  <form method="post" action="/login">
    <input type="password" name="passwort" placeholder="Passwort" autofocus required>
    <button type="submit">Anmelden</button>
  </form>
</div>
</body>
</html>
