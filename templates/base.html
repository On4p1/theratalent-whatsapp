<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titel %}WhatsApp Reaktivierung{% endblock %}</title>
<style>
:root{
  --papier:#FBFAF7; --tinte:#1C1B19; --grau:#6E6A63; --linie:#DFDBD2;
  --gruen:#1F6F4A; --gruen-hell:#E6F0EA; --rot:#9A3324; --rot-hell:#F6E8E5;
  --sand:#F2EFE8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papier);color:var(--tinte);
  font:16px/1.5 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
a{color:var(--tinte)}
header{border-bottom:1px solid var(--linie);background:var(--sand)}
.kopf{max-width:1040px;margin:0 auto;padding:14px 20px;display:flex;
  align-items:baseline;gap:28px}
.marke{font-weight:600;letter-spacing:.01em}
nav a{margin-right:18px;text-decoration:none;color:var(--grau);font-size:15px}
nav a.aktiv{color:var(--tinte);text-decoration:underline;text-underline-offset:4px}
.abmelden{margin-left:auto;font-size:14px;color:var(--grau);text-decoration:none}
main{max-width:1040px;margin:0 auto;padding:28px 20px 72px}
h1{font-size:27px;font-weight:600;margin:0 0 4px}
h2{font-size:19px;font-weight:600;margin:34px 0 10px}
.unterzeile{color:var(--grau);margin:0 0 22px;font-size:15px}
.meldung{background:var(--gruen-hell);border-left:3px solid var(--gruen);
  padding:10px 14px;margin-bottom:22px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-weight:600;font-size:13px;color:var(--grau);
  padding:0 10px 7px;border-bottom:1px solid var(--linie)}
td{padding:11px 10px;border-bottom:1px solid var(--linie);vertical-align:middle}
tr:hover td{background:#fff}
.nr{font-variant-numeric:tabular-nums;color:var(--grau);font-size:14px}
.marke-status{font-size:13px;padding:2px 9px;border-radius:2px;white-space:nowrap}
.s-neu{background:var(--sand);color:var(--grau)}
.s-angeschrieben{background:#EDEFF4;color:#3A4A6B}
.s-geantwortet{background:var(--gruen-hell);color:var(--gruen)}
.s-fehler{background:var(--rot-hell);color:var(--rot)}
.fehlertext{display:block;font-size:13px;color:var(--rot);margin-top:3px}
form.inline{display:inline}
button,input[type=submit]{font:inherit;font-size:15px;padding:7px 15px;
  border:1px solid var(--tinte);background:var(--tinte);color:var(--papier);
  border-radius:2px;cursor:pointer}
button:hover{opacity:.87}
button.leise{background:transparent;color:var(--tinte);border-color:var(--linie)}
button.text{background:none;border:none;color:var(--grau);padding:4px;
  text-decoration:underline;text-underline-offset:3px;font-size:14px}
input[type=text],input[type=password],input[type=file],select,textarea{
  font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--linie);
  background:#fff;border-radius:2px;color:var(--tinte);width:100%}
textarea{resize:vertical;min-height:76px}
:focus-visible{outline:2px solid var(--gruen);outline-offset:1px}
.karte{background:#fff;border:1px solid var(--linie);padding:20px;
  border-radius:2px;margin-bottom:26px}
.raster{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px}
.feld label{display:block;font-size:13px;color:var(--grau);margin-bottom:4px}
.aktionen{margin-top:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.leer{color:var(--grau);padding:34px 0;text-align:center}
.blase{max-width:62%;padding:10px 13px;margin-bottom:9px;border-radius:3px;
  font-size:15px;white-space:pre-wrap;word-break:break-word}
.b-raus{background:var(--gruen-hell);margin-left:auto}
.b-rein{background:#fff;border:1px solid var(--linie)}
.b-system{background:var(--rot-hell);color:var(--rot);font-size:13px;max-width:100%;
  text-align:center;margin:9px auto}
.zeit{display:block;font-size:12px;color:var(--grau);margin-top:4px}
.verlauf{display:flex;flex-direction:column;margin-bottom:22px}
@media(max-width:640px){
  .kopf{flex-wrap:wrap;gap:10px}
  .blase{max-width:85%}
  table{font-size:14px} td,th{padding:8px 6px}
}
</style>
</head>
<body>
<header><div class="kopf">
  <span class="marke">TheraTalent Reaktivierung</span>
  <nav>
    <a href="/" class="{% if seite=='leads' %}aktiv{% endif %}">Kontakte</a>
    <a href="/chats" class="{% if seite=='chats' %}aktiv{% endif %}">Gespräche</a>
  </nav>
  <a href="/logout" class="abmelden">Abmelden</a>
</div></header>
<main>{% block inhalt %}{% endblock %}</main>
</body>
</html>
