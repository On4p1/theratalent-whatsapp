<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titel %}TheraTalent Reaktivierung{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --papier:#FCFBF8; --karte:#FFFFFF; --tinte:#17211E; --grau:#6B746F;
  --linie:#E3E0D8; --linie-fein:#EFEDE6;
  --moos:#2C5F4F; --moos-hell:#E8F0EC; --moos-rand:#BFD6CB;
  --sand:#F3F0E8; --rost:#8E3B2A; --rost-hell:#F8EBE7;
  --blau:#3C5578; --blau-hell:#EBEFF5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--papier);color:var(--tinte);
  font:400 15px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--moos)}

header{background:var(--karte);border-bottom:1px solid var(--linie)}
.kopf{max-width:1080px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:36px;height:62px}
.marke{font:600 17px/1 Fraunces,Georgia,serif;letter-spacing:-.01em;white-space:nowrap}
.marke span{display:block;font:400 11px/1.4 Inter,sans-serif;color:var(--grau);margin-top:3px}
nav{display:flex;gap:4px}
nav a{padding:7px 13px;border-radius:6px;text-decoration:none;color:var(--grau);
  font-size:14px;font-weight:500;transition:background .12s}
nav a:hover{background:var(--sand)}
nav a.aktiv{background:var(--moos-hell);color:var(--moos)}
.abmelden{margin-left:auto;font-size:13px;color:var(--grau);text-decoration:none}
.abmelden:hover{color:var(--tinte)}

main{max-width:1080px;margin:0 auto;padding:34px 24px 80px}
h1{font:600 30px/1.2 Fraunces,Georgia,serif;letter-spacing:-.02em;margin:0 0 6px}
h2{font:600 17px/1.3 Fraunces,Georgia,serif;margin:0 0 14px}
.unterzeile{color:var(--grau);margin:0 0 26px;font-size:15px}

.meldung{background:var(--moos-hell);border:1px solid var(--moos-rand);color:var(--moos);
  padding:11px 16px;margin-bottom:24px;font-size:14px;border-radius:7px}

.zahlen{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
  gap:12px;margin-bottom:30px}
.zahl{background:var(--karte);border:1px solid var(--linie);border-radius:9px;padding:15px 17px}
.zahl b{display:block;font:600 27px/1.1 Fraunces,Georgia,serif;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.zahl span{display:block;font-size:12px;color:var(--grau);margin-top:5px}
.zahl.heben{background:var(--moos-hell);border-color:var(--moos-rand)}
.zahl.heben b{color:var(--moos)}

.karte{background:var(--karte);border:1px solid var(--linie);border-radius:10px;
  padding:22px 24px;margin-bottom:18px}

.raster{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px}
.feld label{display:block;font-size:12px;font-weight:500;color:var(--grau);margin-bottom:5px}
.aktionen{margin-top:17px;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.hinweis{font-size:13px;color:var(--grau)}

input[type=text],input[type=password],input[type=file],select,textarea{
  font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--linie);
  background:var(--papier);border-radius:7px;color:var(--tinte);width:100%;
  transition:border-color .12s,background .12s}
input:focus,select:focus,textarea:focus{background:var(--karte);border-color:var(--moos)}
textarea{resize:vertical;min-height:84px;line-height:1.5}
:focus-visible{outline:2px solid var(--moos);outline-offset:1px}

button{font:inherit;font-size:14px;font-weight:500;padding:9px 17px;border-radius:7px;
  border:1px solid var(--tinte);background:var(--tinte);color:#fff;cursor:pointer;
  transition:opacity .12s}
button:hover{opacity:.86}
button.leise{background:var(--karte);color:var(--tinte);border-color:var(--linie)}
button.leise:hover{background:var(--sand);opacity:1}
button.text{background:none;border:none;color:var(--grau);padding:5px 7px;
  font-size:13px;text-decoration:underline;text-underline-offset:3px}
button.text:hover{color:var(--rost)}
form.inline{display:inline}

.tabelle{background:var(--karte);border:1px solid var(--linie);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--grau);
  letter-spacing:.04em;padding:12px 16px;background:var(--sand);
  border-bottom:1px solid var(--linie)}
td{padding:13px 16px;border-bottom:1px solid var(--linie-fein);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--papier)}
.name{font-weight:500}
.sub{display:block;font-size:12.5px;color:var(--grau);margin-top:2px}
.nr{font-variant-numeric:tabular-nums;color:var(--grau);font-size:13.5px}

.pille{display:inline-block;font-size:12px;font-weight:500;padding:3px 10px;
  border-radius:20px;white-space:nowrap}
.s-neu{background:var(--sand);color:var(--grau)}
.s-angeschrieben{background:var(--blau-hell);color:var(--blau)}
.s-geantwortet{background:var(--moos-hell);color:var(--moos)}
.s-fehler{background:var(--rost-hell);color:var(--rost)}
.fehlertext{display:block;font-size:12px;color:var(--rost);margin-top:4px;max-width:290px}

select.klein{width:auto;padding:5px 9px;font-size:13px}

.leer{color:var(--grau);padding:48px 24px;text-align:center;background:var(--karte);
  border:1px dashed var(--linie);border-radius:10px;font-size:14.5px}

.verlauf{background:var(--karte);border:1px solid var(--linie);border-radius:10px;
  padding:22px;margin-bottom:18px;display:flex;flex-direction:column;gap:3px}
.blase{max-width:66%;padding:11px 14px;border-radius:12px;font-size:14.5px;
  white-space:pre-wrap;word-break:break-word;line-height:1.5}
.b-raus{background:var(--moos-hell);border:1px solid var(--moos-rand);
  margin-left:auto;border-bottom-right-radius:3px}
.b-rein{background:var(--sand);border:1px solid var(--linie);border-bottom-left-radius:3px}
.b-system{background:var(--rost-hell);color:var(--rost);font-size:12.5px;max-width:100%;
  text-align:center;margin:7px auto;border-radius:7px}
.zeit{display:block;font-size:11.5px;color:var(--grau);margin-top:5px;
  font-variant-numeric:tabular-nums}
.zurueck{display:inline-block;font-size:13px;color:var(--grau);text-decoration:none;
  margin-bottom:16px}
.zurueck:hover{color:var(--tinte)}

@media(max-width:700px){
  .kopf{gap:16px;padding:0 16px;height:auto;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
  main{padding:24px 16px 60px}
  h1{font-size:25px}
  .blase{max-width:88%}
  th,td{padding:10px 11px}
  table{font-size:13.5px}
}
</style>
</head>
<body>
<header><div class="kopf">
  <div class="marke">TheraTalent<span>Lead-Reaktivierung</span></div>
  <nav>
    <a href="/" class="{% if seite=='leads' %}aktiv{% endif %}">Kontakte</a>
    <a href="/chats" class="{% if seite=='chats' %}aktiv{% endif %}">Gespräche</a>
  </nav>
  <a href="/logout" class="abmelden">Abmelden</a>
</div></header>
<main>{% block inhalt %}{% endblock %}</main>
</body>
</html>
